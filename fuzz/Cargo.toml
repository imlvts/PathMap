[package]
name = "pathmap-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.pathmap]
path = ".."

[workspace]

[[bin]]
name = "pathmap_ops"
path = "fuzz_targets/pathmap_ops.rs"
test = false
doc = false

# Zipper API fuzzing.  Shares its decoder with examples/pathmap_trace.rs and
# with the Lean model in lean/PathMapModel/Fuzz.lean, so the corpus it produces
# can be replayed through lean/differential.py.
[[bin]]
name = "zipper_ops"
path = "fuzz_targets/zipper_ops.rs"
test = false
doc = false
